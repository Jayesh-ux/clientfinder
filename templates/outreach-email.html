<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
  <tr><td align="center" style="padding:24px 12px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
           style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
      <!-- header -->
      <tr>
        <td style="padding:24px 32px 16px;border-bottom:1px solid #e5e7eb;">
          <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:700;color:#111827;">{{BUSINESS_NAME}}</p>
          <p style="margin:4px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#6b7280;">{{DATELINE}}</p>
        </td>
      </tr>
      <!-- body -->
      <tr>
        <td style="padding:24px 32px;">
          <p style="margin:0 0 12px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#111827;">{{GREETING}}</p>
          <p style="margin:0 0 14px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#1f2937;">{{OPENING}}</p>

          <p style="margin:0 0 4px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#111827;">The problem I noticed</p>
          <p style="margin:0 0 14px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#1f2937;">{{PROBLEM}}</p>

          <p style="margin:0 0 4px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#111827;">Why it costs you</p>
          <p style="margin:0 0 14px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#1f2937;">{{TENSION}}</p>

          <p style="margin:0 0 4px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#111827;">The fix</p>
          <p style="margin:0 0 16px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#1f2937;">{{SOLUTION}}</p>

          <p style="margin:0 0 18px;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#111827;">{{CTA}}</p>
        </td>
      </tr>
      <!-- signature -->
      <tr>
        <td style="padding:18px 32px 28px;border-top:1px solid #e5e7eb;background-color:#f9fafb;">
          <p style="margin:0 0 2px;font-family:Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;color:#111827;">{{SIGNATURE_NAME}}</p>
          <p style="margin:0 0 10px;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#374151;">{{SIGNATURE_ROLE}}</p>
          <p style="margin:0;font-family:Helvetica,Arial,sans-serif;font-size:13px;color:#2563eb;line-height:1.5;">{{CONTACT_LINE}}</p>
        </td>
      </tr>
    </table>
    <p style="margin:14px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:11px;color:#9ca3af;text-align:center;">Sent to {{BUSINESS_EMAIL}} | Reply {{OPT_OUT}}</p>
  </td></tr>
</table>
</body>
</html>
